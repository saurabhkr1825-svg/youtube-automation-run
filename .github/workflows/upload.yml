name: YouTube Automation

on:
  workflow_dispatch:

  schedule:
  - cron: "*/15 * * * *"

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Folders
        run: |
          mkdir -p credentials
          mkdir -p tokens
          mkdir -p logs
          mkdir -p temp/downloads
          mkdir -p data

      - name: Restore Service Account
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > credentials/service_account.json

      - name: Restore YouTube Client
        run: echo '${{ secrets.YOUTUBE_CLIENT_JSON }}' > credentials/youtube_client.json

      - name: Restore Tokens
        run: |
          echo '${{ secrets.CHANNEL1_TOKEN }}' > tokens/channel1.json
          echo '${{ secrets.CHANNEL2_TOKEN }}' > tokens/channel2.json
          echo '${{ secrets.CHANNEL3_TOKEN }}' > tokens/channel3.json
          echo '${{ secrets.CHANNEL4_TOKEN }}' > tokens/channel4.json
          echo '${{ secrets.CHANNEL5_TOKEN }}' > tokens/channel5.json
          echo '${{ secrets.CHANNEL6_TOKEN }}' > tokens/channel6.json
          echo '${{ secrets.CHANNEL7_TOKEN }}' > tokens/channel7.json
          echo '${{ secrets.CHANNEL8_TOKEN }}' > tokens/channel8.json

      - name: Run Pipeline
        run: python run.py
